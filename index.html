<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familienessen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Familienessen</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2622;--mut:#6f675e;--acc:#2f6f4f;--on:#fff;--line:#e8e1d6;--star:#e0a100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171513;--card:#211e1b;--ink:#f1ece4;--mut:#a79f94;--acc:#6fc296;--on:#0f1f17;--line:#34302b;--star:#f0b429}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171513;--card:#211e1b;--ink:#f1ece4;--mut:#a79f94;--acc:#6fc296;--on:#0f1f17;--line:#34302b;--star:#f0b429}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
h1{font-size:1.2rem;margin:0 0 6px}
nav{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 2px;font:inherit;font-size:.9rem;color:var(--mut);cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 10px}
.mut,small{color:var(--mut)}
.err{border-color:#c0392b;color:#c0392b}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-align:center}
.wk button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;cursor:pointer}
.day{display:flex;gap:12px;align-items:center}
.day .dn{width:96px;flex:none;display:flex;flex-direction:column}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:90px;margin:10px 0;resize:vertical}
.pri,.sec{font:inherit;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--acc)}
.pri{background:var(--acc);color:var(--on);width:100%}
.pri:disabled{opacity:.4;cursor:default}
.sec{background:none;color:var(--acc)}
.bar{display:flex;gap:8px;margin-top:6px}
.bar .pri{flex:1}
.stars{display:flex;gap:4px;justify-content:center;margin:12px 0}
.st{background:none;border:0;font-size:2.6rem;line-height:1;color:var(--line);cursor:pointer;padding:2px 6px}
.st.on{color:var(--star)}
.row{display:flex;justify-content:space-between;gap:12px}
.avg{color:var(--star);font-weight:700;white-space:nowrap}
.cm{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line)}
h2{margin:2px 0 0;font-size:1.3rem}
.h3{font-size:1rem;margin:18px 0 8px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:560px;margin:0 auto}
.rl{margin:0;padding-left:20px}
.rl li{margin:6px 0}
.up{display:block;text-align:center;margin-bottom:8px}
.rimg{display:block;width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin-top:8px;cursor:zoom-in}
.rimg.big{max-height:none;object-fit:contain;cursor:zoom-out}
</style>
</head>
<body>
<header>
  <h1 style="display:flex;justify-content:space-between;align-items:center">Familienessen<button class="sec" id="pl" style="padding:2px 10px;font-size:.8rem" onclick="planer()">Planer</button></h1>
  <nav>
    <button data-t="plan" onclick="go('plan')">Woche</button>
    <button data-t="wish" onclick="go('wish')">Wunsch</button>
    <button data-t="rate" onclick="go('rate')">Bewerten</button>
    <button data-t="stats" onclick="go('stats')">Auswertung</button>
  </nav>
</header>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ===== Einstellungen ===== */
const PLANER_PIN='1234'; // BITTE ÄNDERN: Wer die PIN kennt, darf den Speiseplan bearbeiten
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCVsO83q-uUbBnWvUWRgm36m9b1Fjgx1Rk",
  authDomain:"familienessen.firebaseapp.com",
  projectId:"familienessen",
  storageBucket:"familienessen.firebasestorage.app",
  messagingSenderId:"365422281601",
  appId:"1:365422281601:web:3b2e23e13551edefa55e80"
};
/* ===== Firebase starten (anonyme Anmeldung, Daten auch offline lesbar) ===== */
firebase.initializeApp(FIREBASE_CONFIG);
const fsdb=firebase.firestore();
try{fsdb.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
const authP=firebase.auth().signInAnonymously().catch(function(e){console.error(e);return null});
let myUid='';
authP.then(function(c){try{if(c&&c.user){myUid=c.user.uid;render()}}catch(e){}});
const assetsShim={
  upload:function(blob){return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){const d=String(r.result);if(d.length>800000||d.indexOf('data:image/')!==0){rej(new Error('toobig'));return}res({id:d})};
    r.onerror=function(){rej(new Error('read'))};
    r.readAsDataURL(blob);
  })},
  delete:function(){return Promise.resolve()}
};
window.claude={use:async function(n){
  if(n==='db'){const u=await authP;return u?fsdb:null}
  if(n==='user')return{canEdit:function(){try{return localStorage.getItem('planer')==='1'}catch(e){return false}}};
  if(n==='assets')return assetsShim;
  return null;
}};
function planer(){
  if(canEdit){canEdit=false;editing=false;try{localStorage.removeItem('planer')}catch(e){}render();return}
  const x=prompt('Planer-PIN eingeben');
  if(x===null)return;
  if(x===PLANER_PIN){canEdit=true;try{localStorage.setItem('planer','1')}catch(e){}}else{msg='Falsche PIN.'}
  render();
}
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag','Dienstag'];
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
// Name bleibt „monday“, Wochenstart ist aber Mittwoch (Einkauf Dienstagabend, Planung Mi–Di)
const monday=o=>{const d=new Date();d.setHours(12,0,0,0);return addDays(d,-((d.getDay()+4)%7)+7*o)};
const fmt=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'});
const card=t=>'<div class="card mut">'+t+'</div>';
// Essenszeit und maximale Zubereitungszeit am Tag selbst, abgeleitet aus dem Wochenplan (Reihenfolge Mi–Di)
const SLOT=[
  {t:'19:00',max:75,c:'Martin',n:''},
  {t:'19:00',max:60,c:'Kerstin',n:'2. Runde 20:00 (Theresa, Martin)'},
  {t:'18:00',max:75,c:'Kerstin',n:'Theresa kommt erst nach JBO (ca. 18:30), Kerstin Musikprobe 19:15'},
  {t:'18:00',max:90,c:'Kerstin',n:''},
  {t:'13:00',max:150,c:'Martin',n:'Sonntagsessen mittags, gern etwas Festliches'},
  {t:'18:00',max:75,c:'Kerstin',n:'Kerstin Musikprobe 19:15'},
  {t:'18:30',max:60,c:'Martin',n:'2. Runde 20:15 (Theresa, Kerstin), muss sich gut warmhalten lassen'}
];
const startT=(t,m)=>{const p=t.split(':').map(Number),x=p[0]*60+p[1]-m;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};

let tab='plan',off=1,plans={},ratings=[],db=null,canEdit=false,ready=false,tabSet=false;
let editing=false,draft=[],stars=0,comment='',done=false,msg='',busy=false,dm=[],wishes=[],wdish='',wnote='',wfile=null,wbusy=false,wname='',doff='',favs=[],ftext='',fdirty=false,rid=-1,recs=[],rbusy=false,rmsg='',imp='';
try{wname=localStorage.getItem('wname')||''}catch(e){}
const use=n=>window.claude?window.claude.use(n):Promise.resolve(null);

const flag=()=>'rated:'+iso(new Date());
const rated=()=>{try{return !!localStorage.getItem(flag())}catch(e){return false}};
function today(){const n=new Date(),i=(n.getDay()+4)%7;return{i,dish:((plans[iso(monday(0))]||{}).days||[])[i]||''}}

function go(t){tab=t;render()}
function wk(n){off+=n;editing=false;render()}
function edit(){const pl=plans[iso(monday(off))]||{};draft=Array.from({length:7},(_,i)=>(pl.days||[])[i]||'');dm=Array.from({length:7},(_,i)=>(pl.mins||[])[i]||'');doff=pl.offers||'';editing=true;render()}
async function save(){
  try{await db.doc('plan/'+iso(monday(off))).set({days:draft.map(s=>s.trim()),mins:dm.map(x=>Number(x)||0),offers:doff.trim().slice(0,3000)});editing=false}
  catch(e){msg='Der Speiseplan konnte nicht gespeichert werden.'}
  render();
}
function buildPrompt(){
    const g={};
    ratings.forEach(r=>{const k=String(r.dish||'').trim();if(!k)return;(g[k]=g[k]||[]).push(Number(r.stars)||0)});
    const avg=Object.keys(g).map(k=>({k:k,a:g[k].reduce((x,y)=>x+y,0)/g[k].length}));
    const liked=avg.filter(x=>x.a>=4).map(x=>x.k+' ('+x.a.toFixed(1)+' Sterne)').join('; ')||'noch keine Daten';
    const bad=avg.filter(x=>x.a<=2.5).map(x=>x.k+' ('+x.a.toFixed(1)+' Sterne)').join('; ')||'noch keine Daten';
    const prev=[1,2,3].map(k=>((plans[iso(monday(off-k))]||{}).days||[]).filter(Boolean).join('; ')).filter(Boolean).join('; ')||'unbekannt';
    const month=new Date().toLocaleDateString('de-DE',{month:'long'});
    const fl=favs.filter(f=>f.dishes).map(f=>f.name+': '+f.dishes.split('\n').join(', ')).join('; ')||'noch keine eingetragen';
    const cm=ratings.filter(r=>r.comment).slice(0,12).map(r=>r.dish+': '+r.comment).join(' | ')||'keine';
    const HISTORY='Spaghetti Carbonara, Fisch mit Kartoffelsalat, Putenschnitzel mit breiten Nudeln, Currywurst mit Pommes, Frikadellen mit Karottengemüse, Tortellini in Schinken-Sahne-Soße, Lauch-Hackfleisch-Suppe, Rouladen mit Semmelknödeln, selbstgemachte Chicken Nuggets, Leberkäse mit Bratkartoffeln, Lende mit Klößen und Blaukraut, Lasagne mit Salat, Kürbiscremesuppe, Burger, Würstchengulasch, Gnocchi-Auflauf, Tomatensuppe mit Reis, Chinesische Nudeln, Rösti-Blech Jäger Art, Gyrosgeschnetzeltes mit Ebly, Käsespätzle mit Salat, Sandwiches, Bratwürste mit Pommes und Salat, Asia-Nudeln, Tortellini-Blech, Hähnchen mit breiten Nudeln, Hackbraten mit Kartoffeln und Karotten, Wurstnudel, Cordon Bleu mit Pommes und Salat, Schupfnudel-Pfanne mit Kassler, Spinat mit Kartoffeln und Ei, Spaghetti Bolognese mit Salat';
    const RECIPES='Enchiladas (60 Min.), Feierabendblech mit Schweinefilet und Spätzle (35), Asia Chicken mit Reis (30), Pesto-Hähnchen-Blech mit Kartoffeln (65), Spaghetti Carbonara aus dem Ofen (70), Kartoffelpfanne mit Hähnchen und Ei (45), Rösti-Blech Jäger Art (60), Gyros-Rösti-Blech (50), Tortellini-Blech (45), Tortellini-Topf (30), Lasagnetopf (50)';
    const wl=wishesFor(iso(monday(off))).map(w=>w.name+': '+w.dish+(w.note?' ('+w.note+')':'')).join('; ')||'keine';
    const p='Plane 7 Abendessen für die Woche '+fmt(monday(off))+' – '+fmt(addDays(monday(off),6))+' (Mittwoch bis Dienstag) für eine Familie: 2 Erwachsene, 3 Kinder (9, 12 und 14 Jahre). Mischkost, 2 bis 3 Tage pro Woche vegetarisch (ganz ohne Fleisch und Fisch), kaum Fisch und Rind, nie Lamm, Hase oder ähnliches Wild. In JEDEM Essen muss Gemüse oder Salat vorkommen. Einkauf ist Dienstagabend, also soll am Dienstag (letzter Tag) ein Gericht aus Vorräten oder mit haltbarem Gemüse stehen. Saison beachten (Monat: '+month+'). Alltagstauglich, kinderfreundlich, abwechslungsreich, Achte streng auf Abwechslung: Die Beilage (Kartoffeln, Nudeln, Reis, Brot oder Knödel, Getreide) darf nie an zwei Tagen in Folge gleich sein, auch Kartoffelprodukte wie Schupfnudeln, Püree, Pommes, Rösti, Gnocchi und Kartoffelsuppe zählen als Kartoffeln. Die Proteinquelle (Schwein, Geflügel, Hack, Ei oder Käse, Hülsenfrüchte) darf nicht an zwei Tagen in Folge gleich sein. Wechsle außerdem Gemüsesorten, Zubereitungsart (Pfanne, Ofen, Suppe, Auflauf) und Küche (deutsch, italienisch, asiatisch, mexikanisch) ab, und verteile die vegetarischen Tage so, dass sie nicht aufeinander folgen. Bewertungen der Familie (anonym, 1 bis 5 Sterne): Gut angekommen: '+liked+'. Schlecht angekommen (meiden): '+bad+'. Kommentare: '+cm+'. Lieblingsessen der Familienmitglieder: '+fl+'. Plane jede Woche mindestens zwei Lieblingsessen ein (Name der Person in Klammern am Ende) und verteile sie gerecht: Wer in den letzten Wochen kein Lieblingsessen bekam, ist zuerst dran. Gut bewertete Gerichte dürfen nach einigen Wochen wiederkehren, schlecht bewertete nicht. Angebote: Rufe vor dem Planen immer die Seite https://www.edeka.de/maerkte/024786/angebote/ auf (Edeka Frische-Center Höchner, Einkauf dienstags), lies die aktuellen Angebote, vor allem beim Fleisch, und plane Fleisch und Gemüse bevorzugt passend dazu. Zuletzt gegessen (nicht wiederholen, aber als Geschmacksprofil nutzen): '+HISTORY+'; zuletzt in dieser App geplant: '+prev+'. Rezeptsammlung der Familie (höchstens ein bis zwei Tage pro Woche daraus planen, alle anderen Tage mit neuen Ideen im Stil der Familie (deftige Alltagsküche, Nudeln, Aufäufe, Pfannen, Suppen, Ofengerichte); Zubereitungszeit in Klammern; Rinderhack durch Schweine- oder Putenhack ersetzen; Gerichte ohne Gemüse um Salat oder Rohkost ergänzen): '+RECIPES+'. Wunschgerichte der Familie für diese Woche (jeder Wunsch muss an einem Tag eingeplant werden, passend zu Essenszeit und Zubereitungszeit, mit dem Namen der wünschenden Person in Klammern am Ende; ergänze bei Bedarf eine Gemüse- oder Salatbeilage): '+wl+'. Essenszeit und maximale Zubereitungszeit am Tag selbst (nur zur Orientierung für den Aufwand: an Tagen mit wenig Zeit einfache und schnelle Gerichte, am Wochenende gern aufwendigere): '+SLOT.map((x,i)=>DAYS[i]+' '+x.t+' Uhr, '+x.c+' kocht, max. '+x.max+' Min.'+(x.n?' ('+x.n+')':'')).join('; ')+'. Das Gericht muss in dieser Zeit fertig werden (Vorbereiten am Vormittag ist möglich, aber nicht nötig). Antworte ausschließlich mit einem JSON-Objekt der Form {"days":[7 Strings],"mins":[7 Zahlen],"offers":"Text","recipes":[7 Objekte]}. days enthält pro Tag Gericht mit Gemüse- oder Salatbeilage (höchstens 80 Zeichen), mins den Aufwand in Minuten, offers die gelesenen Angebote kurz zusammengefasst (Fleisch, Gemüse, Sonstiges mit Preisen und Gültigkeit). Jedes Rezept hat die Form {"ingredients":["Menge Zutat"],"steps":["Schritt"],"tip":"kurzer Tipp"} mit Menge für 5 Personen, 5 bis 15 Zutaten und 4 bis 8 Schritten (je höchstens 220 Zeichen), metrische Mengen. Bei Gerichten aus der Rezeptsammlung der Familie nutze deren Originalrezept, falls bekannt.';
    return p;
}
async function copyForClaude(){
  try{await navigator.clipboard.writeText(buildPrompt());msg='Kopiert. Füge den Text jetzt im Chat mit Claude ein.'}
  catch(e){msg='Kopieren ist hier nicht möglich. Bitte öffne die Seite in Chrome oder Safari.'}
  render();
}
async function importPlan(){
  let o;
  try{o=JSON.parse(imp.replace(/```json|```/g,'').trim())}catch(e){msg='Der eingefügte Text hat kein gültiges Format.';render();return}
  if(!o||!Array.isArray(o.days)||o.days.length!=7){msg='Der Plan muss genau 7 Gerichte enthalten.';render();return}
  const wk=iso(monday(off)),days=o.days.map(x=>String(x).slice(0,80)),old=plans[wk]||{};
  try{
    const bt=db.batch();
    bt.set(db.doc('plan/'+wk),{days:days,mins:(o.mins||[]).slice(0,7).map(x=>Number(x)||0),offers:String(o.offers!=null?o.offers:(old.offers||'')).slice(0,3000)});
    (o.recipes||[]).slice(0,7).forEach((r,k)=>{
      if(!r)return;
      const L=x=>Array.isArray(x)?x.slice(0,20).map(y=>String(y).slice(0,300)).join('\n'):String(x||'');
      bt.set(db.doc('recipes/'+wk+'_'+k),{dish:days[k],ing:L(r.ingredients||r.ing),steps:L(r.steps),tip:String(r.tip||'').slice(0,300),src:String(r.src||'Von Claude erstellt').slice(0,80)});
    });
    await bt.commit();
    editing=false;imp='';
  }catch(e){msg='Der Plan konnte nicht gespeichert werden.'}
  render();
}
const enc=s=>s.toLowerCase().replace(/[^a-z0-9]/g,c=>'~'+c.charCodeAt(0).toString(16));
const okImg=id=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(id||''));
const wishesFor=wk=>wishes.filter(w=>w.week===wk);
function wishCard(w,del){
  const own=del&&(w.uid?w.uid===myUid:String(w.name||'').toLowerCase()===wname.trim().toLowerCase());
  return '<div class="card"><div class="row"><b>'+esc(w.name)+' wünscht sich</b>'+(own?'<button class="sec" style="padding:2px 10px" onclick="delWish(\''+esc(w.id)+'\')" aria-label="Wunsch entfernen">✕</button>':'')+'</div><div>'+esc(w.dish)+'</div>'+(w.note?'<small>'+esc(w.note)+'</small>':'')+(okImg(w.img)?'<img class="rimg" src="'+w.img+'" alt="Rezept" onclick="this.classList.toggle(\'big\')">':'')+'</div>';
}
function wval(){const b=$('#wsave');if(b)b.disabled=!(wname.trim()&&wdish.trim())||wbusy}
function pickImg(el){wfile=(el.files&&el.files[0])||null;render()}
async function shrink(f){
  try{
    const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height));
    const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
    c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    return (await new Promise(r=>c.toBlob(r,'image/jpeg',0.7)))||f;
  }catch(e){return f}
}
async function saveWish(){
  if(!db||!wname.trim()||!wdish.trim()||wbusy)return;
  wbusy=true;render();
  try{
    const wk=iso(monday(1)),nm=wname.trim().slice(0,30),id=wk+'_'+enc(nm),ex=wishes.find(w=>w.id===id);
    if(ex&&ex.uid&&ex.uid!==myUid){msg='Unter diesem Namen gibt es schon einen Wunsch von einem anderen Gerät. Bitte nutze einen anderen Namen.';wbusy=false;render();return}
    let img=(ex&&okImg(ex.img))?ex.img:'';
    if(wfile){
      const as=await use('assets');
      if(!as)throw new Error('noassets');
      img=(await as.upload(await shrink(wfile))).id;
    }
    await db.doc('wishes/'+id).set({uid:myUid,week:wk,name:nm,dish:wdish.trim().slice(0,80),note:wnote.trim().slice(0,300),img:img});
    try{localStorage.setItem('wname',nm)}catch(e){}
    wdish='';wnote='';wfile=null;
  }catch(e){msg='Der Wunsch konnte nicht gespeichert werden.'+(e&&e.message=='toobig'?' Das Bild ist zu groß, bitte ein kleineres Foto wählen.':'')}
  wbusy=false;render();
}
async function delWish(id){
  const w=wishes.find(x=>x.id===id);
  if(!w||!(w.uid?w.uid===myUid:String(w.name||'').toLowerCase()===wname.trim().toLowerCase()))return;
  try{
    await db.doc('wishes/'+id).delete();
    if(w&&okImg(w.img)){try{const as=await use('assets');if(as)await as.delete(w.img)}catch(e){}}
  }catch(e){msg='Der Wunsch konnte nicht entfernt werden.'}
  render();
}
function viewWish(){
  const m=monday(1),list=wishesFor(iso(m));
  let h='<div class="card"><b>Wunschessen für '+fmt(m)+' – '+fmt(addDays(m,6))+'</b><p class="mut" style="margin:6px 0 0"><small>Jede Person hat pro Woche einen Wunsch. Speicherst du unter demselben Namen erneut, ersetzt das den alten Wunsch. Die Wünsche werden in diese Woche eingeplant.</small></p></div>';
  h+='<div class="card"><input placeholder="Dein Name" maxlength="30" value="'+esc(wname)+'" oninput="wname=this.value;wval()" onchange="render()" style="margin-bottom:8px"><input placeholder="Mein Wunschessen" maxlength="80" value="'+esc(wdish)+'" oninput="wdish=this.value;wval()" style="margin-bottom:8px"><textarea placeholder="Hinweis (optional), z. B. Beilage oder Besonderheit" oninput="wnote=this.value" style="min-height:60px;margin:0 0 8px">'+esc(wnote)+'</textarea>';
  h+=wfile?'<div class="row" style="align-items:center;margin-bottom:8px"><small>Rezeptbild: '+esc(wfile.name)+'</small><button class="sec" style="padding:2px 10px" onclick="wfile=null;render()">✕</button></div>':'<label class="sec up">Rezept als Bild hinzufügen<input type="file" accept="image/*" hidden onchange="pickImg(this)"></label>';
  h+='<button id="wsave" class="pri" '+((wname.trim()&&wdish.trim()&&!wbusy)?'':'disabled')+' onclick="saveWish()">'+(wbusy?'Speichert …':'Wunsch speichern')+'</button></div>';
  h+=list.length?list.map(w=>wishCard(w,true)).join(''):card('Noch keine Wünsche für diese Woche.');
  const myf=favs.find(f=>f.id===enc(wname.trim())),fv=fdirty?ftext:((myf&&myf.dishes)||'');
  h+='<h3 class="h3">Lieblingsessen</h3><div class="card"><small class="mut">Trag hier deine Lieblingsgerichte ein, eins pro Zeile (bis zu 8). Dein Name von oben wird verwendet. Sie fließen immer in den Speiseplan ein.</small><textarea placeholder="z. B. Lasagne&#10;Käsespätzle&#10;Chicken Nuggets" oninput="ftext=this.value;fdirty=true;fval()" style="min-height:110px;margin:8px 0">'+esc(fv)+'</textarea><button id="fsave" class="pri" '+((fdirty&&wname.trim())?'':'disabled')+' onclick="saveFav()">Lieblingsessen speichern</button></div>';
  h+=favs.filter(f=>f.dishes).map(f=>'<div class="card"><b>'+esc(f.name)+'</b><div class="mut"><small>'+esc(f.dishes).split('\n').join(' · ')+'</small></div></div>').join('');
  return h;
}
function fval(){const b=$('#fsave');if(b)b.disabled=!(fdirty&&wname.trim())}
async function saveFav(){
  const nm=wname.trim().slice(0,30);
  if(!db||!nm||!fdirty)return;
  const lines=ftext.split('\n').map(s=>s.trim().slice(0,60)).filter(Boolean).slice(0,8);
  try{
    await db.doc('favs/'+enc(nm)).set({name:nm,dishes:lines.join('\n')});
    try{localStorage.setItem('wname',nm)}catch(e){}
    fdirty=false;
  }catch(e){msg='Die Lieblingsessen konnten nicht gespeichert werden.'}
  render();
}
const dishOf=i=>((plans[iso(monday(off))]||{}).days||[])[i]||'';
const recId=i=>iso(monday(off))+'_'+i;
function recFor(i){const r=recs.find(x=>x.id===recId(i));return(r&&r.dish===dishOf(i))?r:null}
async function openRec(i){
  rid=i;rmsg='';render();
  if(recFor(i)||rbusy)return;
  const s=await use('sample');
  if(!s||!db){rmsg='Für dieses Gericht liegt noch kein Rezept vor. Es kommt mit dem nächsten Plan von Claude.';render();return}
  rbusy=true;render();
  const dish=dishOf(i),mn=Number(((plans[iso(monday(off))]||{}).mins||[])[i])||40;
  try{
    const p='Schreibe ein alltagstaugliches Rezept für: '+dish+'. Menge für 5 Personen (2 Erwachsene, 3 Kinder von 9, 12 und 14 Jahren), Zubereitungszeit etwa '+mn+' Minuten, für eine deutsche Familie. Gemüse oder Salat gehören immer dazu. Metrische Mengen (g, ml, EL, TL). Antworte ausschließlich mit einem JSON-Objekt der Form {"ingredients":["Menge Zutat"],"steps":["Schritt"],"tip":"ein kurzer Tipp"} mit 5 bis 15 Zutaten und 4 bis 8 Schritten, jeder Schritt höchstens 220 Zeichen.';
    const r=await s.json(p,{modelTier:'quick',cache:false});
    if(!r||!Array.isArray(r.ingredients)||!Array.isArray(r.steps))throw new Error('format');
    await db.doc('recipes/'+recId(i)).set({dish:dish,ing:r.ingredients.slice(0,20).map(x=>String(x).slice(0,80)).join('\n'),steps:r.steps.slice(0,10).map(x=>String(x).slice(0,300)).join('\n'),tip:String(r.tip||'').slice(0,300),src:'Von Claude erstellt'});
  }catch(e){rmsg='Das Rezept konnte nicht erstellt werden. Bitte versuch es gleich noch einmal.'}
  rbusy=false;render();
}
function closeRec(){rid=-1;render()}
function viewRecipe(){
  const i=rid,dish=dishOf(i),r=recFor(i),S=SLOT[i],m=monday(off),mn=Number(((plans[iso(m)]||{}).mins||[])[i])||0;
  const w=wishesFor(iso(m)).find(x=>okImg(x.img)&&dish.toLowerCase().indexOf(String(x.dish).toLowerCase())>=0);
  const li=t=>String(t||'').split('\n').filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('');
  let h='<div class="sheet"><div class="wrap"><button class="sec" style="padding:6px 14px;margin-bottom:12px" onclick="closeRec()">‹ Zurück</button>';
  h+='<small class="mut">'+DAYS[i]+' · '+fmt(addDays(m,i))+'</small><h2 style="margin:2px 0 6px">'+esc(dish)+'</h2>';
  if(w)h+='<img class="rimg big" src="'+w.img+'" alt="Rezeptbild von '+esc(w.name)+'" style="margin:12px 0">';
  if(r){
    if(r.src)h+='<p class="mut" style="margin:10px 0 0"><small>'+esc(r.src)+'</small></p>';
    h+='<h3 class="h3">Zutaten (für 5 Personen)</h3><div class="card"><ul class="rl">'+li(r.ing)+'</ul></div>';
    h+='<h3 class="h3">Zubereitung</h3><div class="card"><ol class="rl">'+li(r.steps)+'</ol></div>';
    if(r.tip)h+='<div class="card"><small class="mut">Tipp: '+esc(r.tip)+'</small></div>';
  }else if(rbusy)h+='<div class="card mut" style="margin-top:14px">Claude schreibt das Rezept …</div>';
  else h+='<div class="card'+' mut'+'" style="margin-top:14px">'+esc(rmsg||'Für dieses Gericht gibt es noch kein Rezept.')+'</div>';
  return h+'</div></div>';
}
function setStars(n){stars=n;render()}
async function send(){
  if(!db||!stars)return;
  try{
    await db.collection('ratings').add({date:iso(new Date()),dish:today().dish,stars:stars,comment:comment.trim().slice(0,500)});
    try{localStorage.setItem(flag(),'1')}catch(e){}
    done=true;stars=0;comment='';
  }catch(e){msg='Das Abschicken hat nicht geklappt. Bitte versuch es gleich noch einmal.'}
  render();
}
function again(){try{localStorage.removeItem(flag())}catch(e){}done=false;render()}

function viewPlan(){
  const m=monday(off),pl=plans[iso(m)]||{},days=pl.days||[],mins=pl.mins||[],ti=iso(new Date());
  let h='<div class="wk"><button onclick="wk(-1)" aria-label="Vorherige Woche">‹</button><div><b>'+(off==1?'Nächste Woche':off==0?'Diese Woche':'Woche')+'</b><br><small>'+fmt(m)+' – '+fmt(addDays(m,6))+'</small></div><button onclick="wk(1)" aria-label="Nächste Woche">›</button></div><small class="mut" style="display:block;text-align:center;margin:-4px 0 10px">Tippe auf ein Gericht für das Rezept</small>';
  h+=DAYS.map((n,i)=>{
    const d=addDays(m,i),v=(editing?draft[i]:days[i])||'',mn=Number(editing?dm[i]:mins[i])||0,S=SLOT[i];
    const info='';
    return '<div class="card day'+(iso(d)==ti?' today':'')+'"'+((!editing&&v)?' onclick="openRec('+i+')" style="cursor:pointer"':'')+'><div class="dn"><b>'+n+'</b><small>'+fmt(d)+'</small></div>'+
      '<div style="flex:1;min-width:0">'+(editing?'<input value="'+esc(v)+'" maxlength="80" placeholder="Abendessen" oninput="draft['+i+']=this.value">':'<div class="'+(v?'':'mut')+'">'+(v?esc(v):'noch offen')+'</div>'+info)+'</div></div>';
  }).join('');
  if(canEdit)h+=editing?'<button class="sec" style="width:100%;margin-bottom:8px" '+'onclick="copyForClaude()">Daten für Claude kopieren</button><textarea placeholder="Plan von Claude hier einfügen" oninput="imp=this.value" style="min-height:70px;margin:0 0 8px">'+esc(imp)+'</textarea><button class="sec" style="width:100%;margin-bottom:8px" onclick="importPlan()">Plan übernehmen'+'</button><div class="bar"><button class="sec" onclick="editing=false;render()">Abbrechen</button><button class="pri" onclick="save()">Speichern</button></div>':'<button class="sec" style="width:100%" onclick="edit()">Speiseplan bearbeiten</button>';
  const ws=wishesFor(iso(m));
  if(ws.length)h+='<h3 class="h3">Wunschessen für diese Woche</h3>'+ws.map(w=>wishCard(w,false)).join('');
  if(pl.offers)h+='<h3 class="h3">Angebote beim Einkauf</h3><div class="card"><small style="white-space:pre-line">'+esc(pl.offers)+'</small></div>';
  return h;
}

function viewRate(){
  const t=today();
  if(!t.dish)return card('Für heute steht kein Abendessen im Plan.'+(canEdit?' Trag es im Tab „Woche“ ein.':''));
  if(done||rated())return '<div class="card" style="text-align:center"><h2>Danke für deine Bewertung!</h2><p class="mut">Sie wurde anonym gespeichert.</p><button class="sec" onclick="again()">Noch jemand bewertet an diesem Gerät</button></div>';
  let h='<div class="card"><small>Heute, '+DAYS[t.i]+'</small><h2>'+esc(t.dish)+'</h2>';
  if(new Date().getHours()<18)h+='<p class="mut">Gedacht für den Abend nach dem Essen – du kannst aber schon jetzt bewerten.</p>';
  h+='<div class="stars">'+[1,2,3,4,5].map(n=>'<button class="st'+(n<=stars?' on':'')+'" onclick="setStars('+n+')" aria-label="'+n+' von 5 Sternen">★</button>').join('')+'</div>';
  h+='<textarea placeholder="Was war gut, was könnte besser sein? (optional)" oninput="comment=this.value">'+esc(comment)+'</textarea>';
  h+='<button class="pri" '+(stars?'':'disabled')+' onclick="send()">Anonym abschicken</button><p class="mut" style="margin:10px 0 0"><small>Es wird kein Name und keine Kennung gespeichert.</small></p></div>';
  return h;
}

function viewStats(){
  const g={};
  ratings.forEach(r=>{
    const k=String(r.dish||'').trim().toLowerCase();if(!k)return;
    const e=g[k]||(g[k]={dish:String(r.dish).trim(),s:[],c:[]});
    e.s.push(Number(r.stars)||0);if(r.comment)e.c.push(r.comment);
  });
  const list=Object.values(g).map(x=>({dish:x.dish,s:x.s,c:x.c,avg:x.s.reduce((a,b)=>a+b,0)/x.s.length})).sort((a,b)=>b.avg-a.avg);
  if(!list.length)return card('Noch keine Bewertungen. Sobald jemand bewertet hat, siehst du hier, welche Gerichte gut ankommen.');
  return list.map(x=>'<div class="card"><div class="row"><b>'+esc(x.dish)+'</b><span class="avg">★ '+x.avg.toFixed(1).replace('.',',')+'</span></div><small>'+x.s.length+(x.s.length==1?' Bewertung':' Bewertungen')+'</small>'+x.c.map(c=>'<p class="cm">„'+esc(c)+'“</p>').join('')+'</div>').join('');
}

function render(){
  const v=!ready?card('Lade …'):!db?card('Die Verbindung zur Datenbank fehlt. Bitte prüfe das Internet und lade die Seite neu.'):tab=='plan'?viewPlan():tab=='wish'?viewWish():tab=='rate'?viewRate():viewStats();
  $('#app').innerHTML=(msg?'<div class="card'+(/^Kopiert/.test(msg)?'':' err')+'">'+esc(msg)+'</div>':'')+v+(rid>=0?viewRecipe():'');msg='';
  $('#pl').textContent=canEdit?'Planer ✓':'Planer';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
}

render();
(async()=>{
  const timer=setTimeout(()=>{ready=true;render()},10000);
  const use=n=>window.claude?window.claude.use(n):Promise.resolve(null);
  try{const u=await use('user');canEdit=!!(u&&u.canEdit())}catch(e){}
  try{db=await use('db')}catch(e){}
  if(!db){clearTimeout(timer);ready=true;render();return}
  const fail=()=>{clearTimeout(timer);ready=true;render()};
  db.collection('plan').onSnapshot(s=>{
    clearTimeout(timer);plans={};s.docs.forEach(d=>{plans[d.id]=d.data()});ready=true;
    if(!tabSet){tabSet=true;if(new Date().getHours()>=18&&today().dish&&!rated())tab='rate'}
    render();
  },fail);
  db.collection('ratings').onSnapshot(s=>{ratings=s.docs.map(d=>d.data());if(ready)render()},()=>{});
  db.collection('wishes').onSnapshot(s=>{wishes=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ready&&!(tab=='wish'&&(wdish||wnote)))render()},()=>{});
  db.collection('favs').onSnapshot(s=>{favs=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ready&&!(tab=='wish'&&(wdish||wnote||fdirty)))render()},()=>{});
  db.collection('recipes').onSnapshot(s=>{recs=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ready&&!(tab=='wish'&&(wdish||wnote||fdirty)))render()},()=>{});
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
